<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUREL'IA — Aélys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    :root {
      --cream:       #F5F1EE;
      --sand:        #EFE8E0;
      --gold:        #A87B27;
      --gold-light:  #C9A04A;
      --navy:        #112033;
      --white:       #FFFFFF;
      --text:        #1C1C1C;
      --text-muted:  #7A7068;
      --alert:       #B94040;
      --glass-bg:    rgba(255,255,255,0.55);
      --glass-border:rgba(168,123,39,0.18);
      --shadow:      0 6px 28px rgba(17,32,51,0.09);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      position: relative; overflow: hidden;
    }
    body::before {
      content:'';
      position:fixed; inset:0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 10%, rgba(168,123,39,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 10% 90%, rgba(17,32,51,0.05) 0%, transparent 60%);
      pointer-events:none;
    }
    .orb { position:fixed; border-radius:50%; filter:blur(60px); pointer-events:none; animation:drift 18s ease-in-out infinite alternate; }
    .orb-1 { width:340px;height:340px;background:rgba(168,123,39,0.09);top:-80px;right:-80px;animation-delay:0s; }
    .orb-2 { width:280px;height:280px;background:rgba(17,32,51,0.06);bottom:-60px;left:-60px;animation-delay:-9s; }
    @keyframes drift { from{transform:translate(0,0) scale(1);}to{transform:translate(30px,20px) scale(1.08);} }

    .app {
      width:100%; max-width:820px;
      height:92vh; max-height:860px;
      display:flex; flex-direction:column;
      background:var(--glass-bg);
      backdrop-filter:blur(24px) saturate(1.4);
      -webkit-backdrop-filter:blur(24px) saturate(1.4);
      border:1px solid var(--glass-border);
      border-radius:24px;
      box-shadow:var(--shadow), 0 1px 0 rgba(255,255,255,0.8) inset;
      overflow:hidden; position:relative;
    }

    .header {
      padding:17px 24px 15px;
      background:rgba(255,255,255,0.7);
      border-bottom:1px solid rgba(168,123,39,0.12);
      display:flex; align-items:center; gap:12px; flex-shrink:0;
    }
    .logo-ring {
      width:38px;height:38px;border-radius:11px;
      background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 100%);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
      box-shadow:0 3px 10px rgba(17,32,51,0.2);
    }
    .logo-ring svg { width:19px;height:19px; }
    .header-text { flex:1; }
    .header-title { font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:600;color:var(--navy);letter-spacing:0.5px;line-height:1; }
    .header-sub { font-size:0.72rem;color:var(--text-muted);font-weight:400;margin-top:3px;letter-spacing:0.8px;text-transform:uppercase; }
    .status-pill { display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(168,123,39,0.08);border:1px solid rgba(168,123,39,0.2);border-radius:100px;font-size:0.72rem;color:var(--gold);font-weight:500;letter-spacing:0.3px; }
    .status-dot { width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.8);} }

    .chat { flex:1;overflow-y:auto;padding:20px 24px;scroll-behavior:smooth; }
    .chat::-webkit-scrollbar { width:5px; }
    .chat::-webkit-scrollbar-track { background:transparent; }
    .chat::-webkit-scrollbar-thumb { background:rgba(168,123,39,0.25);border-radius:10px; }

    .welcome { text-align:center;padding:20px 10px 10px; }
    .welcome-icon { font-size:2.2rem;margin-bottom:12px;display:block; }
    .welcome h2 { font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--navy);font-weight:600;margin-bottom:8px; }
    .welcome p { color:var(--text-muted);font-size:0.88rem;line-height:1.6;max-width:400px;margin:0 auto 28px; }
    .quick-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:680px;margin:0 auto; }
    .quick-btn {
      padding:12px 14px;
      background:rgba(255,255,255,0.8);
      border:1px solid rgba(168,123,39,0.2);
      border-radius:12px; cursor:pointer;
      font-family:'DM Sans',sans-serif;font-size:0.83rem;font-weight:500;color:var(--navy);
      text-align:left; transition:all 0.2s ease;
      display:flex; align-items:center; gap:9px;
      backdrop-filter:blur(8px);
    }
    .quick-btn:hover { background:rgba(255,255,255,0.95);border-color:var(--gold);box-shadow:0 4px 14px rgba(168,123,39,0.14);transform:translateY(-1px); }
    .btn-icon { width:29px;height:29px;border-radius:8px;background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 100%);display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0; }
    .btn-label { line-height:1.3; }
    .btn-label small { display:block;font-size:0.7rem;color:var(--text-muted);font-weight:400;margin-top:1px; }

    .msg { display:flex;gap:10px;margin-bottom:15px;animation:fadeUp 0.28s ease-out both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);} }
    .msg.user { flex-direction:row-reverse; }
    .avatar { width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:0.8rem;flex-shrink:0;margin-top:2px; }
    .msg.user .avatar { background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 100%);box-shadow:0 2px 8px rgba(168,123,39,0.28); }
    .msg.assistant .avatar { background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 100%);box-shadow:0 2px 8px rgba(17,32,51,0.18); }
    .bubble { max-width:68%;padding:11px 15px;border-radius:14px;font-size:0.9rem;line-height:1.65; }
    .msg.user .bubble { background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 100%);color:var(--white);border-bottom-right-radius:4px;box-shadow:0 3px 12px rgba(17,32,51,0.16); }
    .msg.assistant .bubble { background:rgba(255,255,255,0.85);color:var(--text);border-bottom-left-radius:4px;box-shadow:0 2px 10px rgba(17,32,51,0.06);border:1px solid rgba(168,123,39,0.1); }
    .bubble.alert-bubble { background:rgba(185,64,64,0.07);border:1px solid rgba(185,64,64,0.25);color:var(--alert); }
    .alert-header { display:flex;align-items:center;gap:7px;font-weight:600;font-size:0.82rem;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px; }

    .typing { display:none;gap:10px;margin-bottom:15px; }
    .typing.active { display:flex; }
    .typing-dots { display:flex;gap:5px;align-items:center;padding:11px 15px;background:rgba(255,255,255,0.85);border-radius:14px;border-bottom-left-radius:4px;border:1px solid rgba(168,123,39,0.1); }
    .typing-dot { width:7px;height:7px;border-radius:50%;background:var(--gold);animation:bounce 1.3s ease-in-out infinite; }
    .typing-dot:nth-child(2){animation-delay:0.15s;}
    .typing-dot:nth-child(3){animation-delay:0.3s;}
    @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4;}30%{transform:translateY(-7px);opacity:1;} }

    .input-bar { padding:14px 18px;background:rgba(255,255,255,0.75);border-top:1px solid rgba(168,123,39,0.12);display:flex;gap:9px;align-items:center;flex-shrink:0; }
    #userInput { flex:1;padding:11px 16px;border:1.5px solid rgba(168,123,39,0.2);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--text);background:rgba(255,255,255,0.9);outline:none;transition:border-color 0.2s,box-shadow 0.2s; }
    #userInput::placeholder { color:var(--text-muted); }
    #userInput:focus { border-color:var(--gold);box-shadow:0 0 0 3px rgba(168,123,39,0.1); }
    #sendBtn { width:42px;height:42px;border-radius:11px;border:none;background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 100%);color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s ease;box-shadow:0 3px 12px rgba(17,32,51,0.18); }
    #sendBtn:hover:not(:disabled) { transform:translateY(-1px);box-shadow:0 5px 16px rgba(17,32,51,0.26); }
    #sendBtn:disabled { opacity:0.45;cursor:not-allowed;transform:none; }
    #sendBtn svg { width:17px;height:17px; }

    .error-msg { background:rgba(185,64,64,0.08);border:1px solid rgba(185,64,64,0.2);color:var(--alert);padding:12px 16px;border-radius:12px;margin-bottom:14px;font-size:0.85rem;text-align:center;animation:fadeUp 0.25s ease; }

    .bubble.md p { margin-bottom: 8px; }
    .bubble.md p:last-child { margin-bottom: 0; }
    .bubble.md strong { font-weight: 600; color: var(--navy); }
    .bubble.md em { font-style: italic; color: var(--text-muted); }
    .bubble.md ul, .bubble.md ol { padding-left: 18px; margin: 6px 0; }
    .bubble.md li { margin-bottom: 4px; }
    .bubble.md h1,.bubble.md h2,.bubble.md h3 { font-family:"Playfair Display",serif; color:var(--navy); margin: 10px 0 4px; font-size:1rem; font-weight:600; }
    .bubble.md h3 { font-size:0.9rem; }
    .bubble.md blockquote { border-left:3px solid var(--gold); padding-left:10px; margin:6px 0; color:var(--text-muted); font-style:italic; }
    .bubble.md code { background:rgba(17,32,51,0.07); padding:1px 5px; border-radius:4px; font-size:0.82rem; }
    .bubble.md hr { border:none; border-top:1px solid rgba(168,123,39,0.2); margin:8px 0; }
    .source-tag { display:inline-block; margin-top:10px; padding:3px 10px; background:rgba(168,123,39,0.1); border:1px solid rgba(168,123,39,0.25); border-radius:100px; font-size:0.72rem; color:var(--gold); font-weight:500; }

    /* ── BOUTON PDF PROCÉDURE ──────── */
    .pdf-card-wrap { padding-left:40px; margin-top:8px; }
    .pdf-card {
      display:flex; align-items:center; gap:11px;
      padding:10px 13px; max-width:340px;
      background:rgba(255,255,255,0.85);
      border:1px solid rgba(168,123,39,0.25);
      border-radius:12px; text-decoration:none;
      transition:all 0.18s ease;
      box-shadow:0 2px 8px rgba(17,32,51,0.06);
    }
    .pdf-card:hover { border-color:var(--gold); box-shadow:0 3px 14px rgba(168,123,39,0.16); transform:translateY(-1px); }
    .pdf-card-icon {
      width:34px; height:34px; border-radius:9px; flex-shrink:0;
      background:linear-gradient(135deg,var(--alert) 0%,#d35454 100%);
      display:flex; align-items:center; justify-content:center; color:white;
    }
    .pdf-card-icon svg { width:18px; height:18px; }
    .pdf-card-info { flex:1; min-width:0; }
    .pdf-card-title { font-size:0.83rem; font-weight:600; color:var(--navy); line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pdf-card-meta { font-size:0.7rem; color:var(--text-muted); margin-top:2px; display:flex; align-items:center; gap:5px; }
    .pdf-card-arrow { color:var(--gold); flex-shrink:0; }
    /* ──────────────────────────────── */

    /* ── ACTIONS SOUS LES RÉPONSES ───── */
    .msg-actions { display:flex; gap:6px; margin-top:6px; padding-left:40px; flex-wrap:wrap; }
    .msg-action-btn {
      display:inline-flex; align-items:center; gap:4px;
      padding:4px 10px; border-radius:8px; border:1px solid rgba(168,123,39,0.2);
      background:rgba(255,255,255,0.7); color:var(--text-muted);
      font-size:0.72rem; font-weight:500; cursor:pointer; transition:all 0.15s;
    }
    .msg-action-btn:hover { border-color:var(--gold); color:var(--navy); background:white; }
    .msg-action-btn.copied { color:#2e7d32; border-color:#2e7d32; background:rgba(46,125,50,0.06); }
    .msg-action-btn.liked  { color:var(--gold); border-color:var(--gold); }
    .msg-action-btn.disliked { color:var(--alert); border-color:var(--alert); }

    /* ── SUGGESTIONS "VOIR AUSSI" ──── */
    .suggestions-wrap { padding-left:40px; margin-top:4px; }
    .suggestions-label { font-size:0.68rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:5px; }
    .suggestions-chips { display:flex; gap:6px; flex-wrap:wrap; }
    .sugg-chip {
      padding:5px 11px; border-radius:100px; border:1px solid rgba(168,123,39,0.25);
      background:rgba(168,123,39,0.06); color:var(--navy); font-size:0.75rem;
      cursor:pointer; transition:all 0.15s;
    }
    .sugg-chip:hover { background:var(--navy); color:white; border-color:var(--navy); }
    /* ──────────────────────────────── */

    /* ── ANNUAIRE PANEL ─────────────────────────── */
    .annuaire-overlay {
      display:none; position:fixed; inset:0; background:rgba(17,32,51,0.45);
      z-index:100; backdrop-filter:blur(3px); animation:fadeIn 0.2s ease;
    }
    .annuaire-overlay.open { display:block; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }

    .annuaire-panel {
      position:fixed; top:0; right:-440px; width:420px; max-width:100vw;
      height:100dvh; background:var(--cream);
      box-shadow:-8px 0 40px rgba(17,32,51,0.18);
      display:flex; flex-direction:column; z-index:101;
      transition:right 0.32s cubic-bezier(0.4,0,0.2,1);
    }
    .annuaire-panel.open { right:0; }

    .ann-header {
      padding:20px 22px 16px;
      background:var(--navy);
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    }
    .ann-header-left { display:flex; align-items:center; gap:10px; }
    .ann-title { font-family:'Playfair Display',serif; font-size:1.1rem; color:var(--gold); font-weight:600; letter-spacing:0.5px; }
    .ann-sub { font-size:0.7rem; color:rgba(239,232,224,0.6); text-transform:uppercase; letter-spacing:0.8px; margin-top:2px; }
    .ann-close {
      width:32px; height:32px; border-radius:8px; border:none;
      background:rgba(255,255,255,0.1); color:var(--sand); cursor:pointer;
      display:flex; align-items:center; justify-content:center; font-size:1.1rem;
      transition:background 0.15s;
    }
    .ann-close:hover { background:rgba(255,255,255,0.2); }

    .ann-search-wrap {
      padding:14px 16px 10px; background:rgba(255,255,255,0.6);
      border-bottom:1px solid var(--sand); flex-shrink:0;
    }
    .ann-search {
      width:100%; padding:9px 14px; border:1.5px solid rgba(168,123,39,0.22);
      border-radius:10px; font-family:'DM Sans',sans-serif; font-size:0.85rem;
      background:white; outline:none; transition:border-color 0.2s;
    }
    .ann-search:focus { border-color:var(--gold); }

    .ann-filters {
      padding:10px 16px 0; display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0;
      background:rgba(255,255,255,0.6); border-bottom:1px solid var(--sand); padding-bottom:10px;
    }
    .ann-filter {
      padding:5px 12px; border-radius:100px; border:1.5px solid rgba(168,123,39,0.25);
      font-size:0.75rem; font-weight:500; color:var(--text-muted); cursor:pointer;
      background:white; transition:all 0.15s; white-space:nowrap;
    }
    .ann-filter:hover { border-color:var(--gold); color:var(--navy); }
    .ann-filter.active { background:var(--navy); color:white; border-color:var(--navy); }

    .ann-body { flex:1; overflow-y:auto; padding:14px 16px 20px; }
    .ann-body::-webkit-scrollbar { width:4px; }
    .ann-body::-webkit-scrollbar-thumb { background:rgba(168,123,39,0.2); border-radius:10px; }

    .ann-service-label {
      font-size:0.68rem; font-weight:600; color:var(--gold); text-transform:uppercase;
      letter-spacing:1px; margin:18px 0 8px; padding-left:2px;
    }
    .ann-service-label:first-child { margin-top:0; }

    .ann-card {
      background:white; border:1px solid rgba(168,123,39,0.12);
      border-radius:14px; padding:14px 16px; margin-bottom:8px;
      cursor:pointer; transition:all 0.18s; position:relative;
    }
    .ann-card:hover { border-color:var(--gold); box-shadow:0 4px 16px rgba(168,123,39,0.12); transform:translateY(-1px); }
    .ann-card.expanded { border-color:var(--gold); background:rgba(168,123,39,0.03); }

    .ann-card-top { display:flex; align-items:flex-start; gap:12px; }
    .ann-avatar {
      width:44px; height:44px; border-radius:12px; flex-shrink:0;
      background:linear-gradient(135deg,var(--navy),#1e3a5f);
      display:flex; align-items:center; justify-content:center;
      font-size:1rem; color:var(--gold); font-family:'Playfair Display',serif;
      font-weight:600; overflow:hidden;
    }
    .ann-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .ann-info { flex:1; min-width:0; }
    .ann-nom { font-weight:600; font-size:0.9rem; color:var(--navy); line-height:1.2; }
    .ann-poste { font-size:0.76rem; color:var(--text-muted); margin-top:2px; line-height:1.3; }

    .ann-card-actions {
      display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;
    }
    .ann-action {
      display:inline-flex; align-items:center; gap:5px;
      padding:5px 10px; border-radius:8px; font-size:0.75rem; font-weight:500;
      text-decoration:none; border:1px solid rgba(168,123,39,0.2);
      color:var(--navy); background:rgba(168,123,39,0.06); transition:all 0.15s;
    }
    .ann-action:hover { background:var(--gold); color:white; border-color:var(--gold); }

    .ann-qfq {
      display:none; margin-top:12px; padding-top:12px;
      border-top:1px solid rgba(168,123,39,0.12);
    }
    .ann-card.expanded .ann-qfq { display:block; }
    .ann-qfq-title { font-size:0.7rem; font-weight:600; color:var(--gold); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:7px; }
    .ann-qfq ul { list-style:none; padding:0; margin:0; }
    .ann-qfq li { font-size:0.82rem; color:var(--text); line-height:1.5; padding:3px 0 3px 14px; position:relative; }
    .ann-qfq li::before { content:'→'; position:absolute; left:0; color:var(--gold); font-size:0.7rem; top:4px; }

    .ann-chevron { font-size:0.7rem; color:var(--text-muted); transition:transform 0.2s; margin-top:2px; }
    .ann-card.expanded .ann-chevron { transform:rotate(180deg); }

    .ann-empty { text-align:center; color:var(--text-muted); font-size:0.85rem; padding:40px 0; }

    /* Bouton annuaire dans le header */
    .ann-btn {
      display:flex; align-items:center; gap:6px;
      padding:7px 13px; border-radius:100px; border:none; cursor:pointer;
      background:rgba(168,123,39,0.1); border:1px solid rgba(168,123,39,0.22);
      font-family:'DM Sans',sans-serif; font-size:0.75rem; font-weight:500;
      color:var(--gold); transition:all 0.2s;
    }
    .ann-btn:hover { background:var(--navy); color:var(--gold); border-color:var(--navy); }
    /* ─────────────────────────────────────────── */

    /* Bouton retour (masqué tant qu'on est sur l'accueil) */
    .back-btn { display:none; }
    .back-btn.visible { display:flex; }

    /* ── Liste des fiches d'une catégorie (réutilise le panneau annuaire) ── */
    .cat-item {
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      background:white; border:1px solid rgba(168,123,39,0.12);
      border-radius:12px; padding:13px 16px; margin-bottom:8px;
      cursor:pointer; transition:all 0.18s;
      font-size:0.87rem; color:var(--navy); font-weight:500;
    }
    .cat-item:hover { border-color:var(--gold); box-shadow:0 4px 16px rgba(168,123,39,0.12); transform:translateY(-1px); }
    .cat-item-arrow { color:var(--gold); flex-shrink:0; }
    /* ─────────────────────────────────────────── */

    @media (max-width:600px) {
      .app { height:100dvh;max-height:100dvh;border-radius:0; }
      .bubble { max-width:82%; }
      .quick-grid { grid-template-columns:repeat(2,1fr); }
      .header { padding:16px 18px; }
      .chat { padding:16px; }
      .input-bar { padding:12px 14px; }
      .annuaire-panel { width:100vw; }
    }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="app">
  <div class="header">
    <div class="logo-ring">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

  <div class="chat" id="chat">

  <div class="input-bar">

    <button id="sendBtn" onclick="sendMessage()">

        <line x1="22" y1="2" x2="11" y2="13"></line>

<script>
const chatEl     = document.getElementById('chat');
const messagesEl = document.getElementById('chatMessages');
const inputEl    = document.getElementById('userInput');
const sendBtnEl  = document.getElementById('sendBtn');
const typingEl   = document.getElementById('typing');

// ── Mémoire de conversation (max 6 échanges = 12 messages) ──
const conversationHistory = [];

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendMessage(); });
function ask(q) { inputEl.value = q; sendMessage(); }

// ── Accueil / retour ──────────────────────────────────────────
function goHome() {
  document.getElementById('welcome').style.display = '';
  messagesEl.style.display = 'none';
  typingEl.classList.remove('active');
  document.getElementById('backBtn').classList.remove('visible');
  scrollDown();
}
function goToChat() {
  document.getElementById('welcome').style.display = 'none';
  messagesEl.style.display = '';
  document.getElementById('backBtn').classList.add('visible');
}

// ── Catégories : liste des fiches (au lieu d'une question figée) ──
let DOCS_INDEX = [];
async function loadDocsIndex() {
  try {
    const res = await fetch('/docs-index.json');
    DOCS_INDEX = await res.json();
  } catch(e) { DOCS_INDEX = []; }
}
loadDocsIndex();

// ── BIBLIOTHÈQUE (toutes les procédures : classement par thème + recherche
// par mot-clé dans le titre ET le contenu — utilise le même docs-index.json
// que les catégories rapides ci-dessous, désormais enrichi d'un champ
// "contenu" côté build.js) ──────────────────────────────────────────────
const BIB_THEMES = [
  { key:'Commandes',     label:'Commandes',      icon:'🛒' },
  { key:'Defectueux',    label:'Défectueux',     icon:'🔍' },
  { key:'Sav',           label:'SAV',            icon:'🔧' },
  { key:'Vente',         label:'Vente',          icon:'💬' },
  { key:'References',    label:'Références',     icon:'💻' },
  { key:'Formation',     label:'Formation',      icon:'🎓' },
  { key:'Commandes Web', label:'Commandes Web',  icon:'📦' },
  { key:'Inventaires',   label:'Inventaires',    icon:'📋' },
];
const bibThemeMeta = k => BIB_THEMES.find(t => t.key === k) || { label:k, icon:'🏷️' };
let bibActiveFilter = 'Tous';

function foldAccents(s) { return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function escapeBibHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function buildBibFilters() {
  const present = [...new Set(DOCS_INDEX.map(d => d.categorie))];
  let html = `<button class="ann-filter ${bibActiveFilter==='Tous'?'active':''}" onclick="setBibFilter('Tous')">Tous</button>`;
  present.forEach(key => {
    const meta = bibThemeMeta(key);
    html += `<button class="ann-filter ${bibActiveFilter===key?'active':''}" onclick="setBibFilter('${key.replace(/'/g,"\\'")}')">${meta.icon} ${meta.label}</button>`;
  });
  document.getElementById('bibFilters').innerHTML = html;
}

function setBibFilter(key) {
  bibActiveFilter = key;
  buildBibFilters();
  renderBiblio();
}

function renderBiblio() {
  const q = foldAccents(document.getElementById('bibSearch')?.value || '');
  let filtered = DOCS_INDEX;
  if (bibActiveFilter !== 'Tous') filtered = filtered.filter(d => d.categorie === bibActiveFilter);
  if (q) filtered = filtered.filter(d => foldAccents(d.titre + ' ' + (d.contenu || '')).includes(q));

  const body = document.getElementById('bibBody');
  if (!filtered.length) {
    body.innerHTML = '<div class="ann-empty">Aucune procédure trouvée.</div>';
    return;
  }

  // Groupées par thème (pertinent surtout quand "Tous" est actif ; en
  // recherche/filtre, chaque thème présent dans les résultats garde son
  // propre libellé pour rester repérable).
  const byTheme = {};
  filtered.forEach(d => {
    if (!byTheme[d.categorie]) byTheme[d.categorie] = [];
    byTheme[d.categorie].push(d);
  });

  let html = '';
  for (const [theme, items] of Object.entries(byTheme)) {
    const meta = bibThemeMeta(theme);
    html += `<div class="ann-service-label">${meta.icon} ${meta.label}</div>`;
    items.forEach(d => {
      html += `
        <div class="cat-item" onclick="openBibDoc('${d.id}')">
          <span>${escapeBibHtml(d.titre)}</span>
          <span class="cat-item-arrow">→</span>
        </div>`;
    });
  }
  body.innerHTML = html;
}

function openBibDoc(id) {
  window.open('/api/pdf?id=' + encodeURIComponent(id), '_blank', 'noopener');
}

function toggleBiblio() {
  document.getElementById('bibPanel').classList.toggle('open');
  document.getElementById('bibOverlay').classList.toggle('open');
  if (document.getElementById('bibPanel').classList.contains('open')) {
    buildBibFilters();
    renderBiblio();
    setTimeout(() => document.getElementById('bibSearch')?.focus(), 350);
  }
}
function closeBiblio() {
  document.getElementById('bibPanel').classList.remove('open');
  document.getElementById('bibOverlay').classList.remove('open');
}
// ──────────────────────────────────────────────────────────────────────

function openCategory(label, categorieValue) {
  const items = DOCS_INDEX.filter(d => d.categorie === categorieValue);
  document.getElementById('catTitle').textContent = '📁 ' + label;
  document.getElementById('catSub').textContent = items.length + (items.length > 1 ? ' procédures' : ' procédure');
  const body = document.getElementById('catBody');
  if (!items.length) {
    body.innerHTML = '<div class="ann-empty">Aucune procédure trouvée dans cette catégorie.</div>';
  } else {
    body.innerHTML = items.map(d => `
      <div class="cat-item" onclick="askFromCategory('${d.titre.replace(/'/g, "\\'")}')">
        <span>${d.titre}</span>
        <span class="cat-item-arrow">→</span>
      </div>`).join('');
  }
  document.getElementById('catPanel').classList.add('open');
  document.getElementById('catOverlay').classList.add('open');
}
function closeCategory() {
  document.getElementById('catPanel').classList.remove('open');
  document.getElementById('catOverlay').classList.remove('open');
}
function askFromCategory(titre) {
  closeCategory();
  ask(titre);
}

// ── Identification du magasin (Basic Auth) + historique local ─
let currentMagasin = null;
let renderLog = [];
const HISTORY_LIMIT = 40;

function historyKey() { return 'aurelia_history_' + (currentMagasin || 'anonyme'); }

function saveHistory() {
  try { localStorage.setItem(historyKey(), JSON.stringify(renderLog.slice(-HISTORY_LIMIT))); }
  catch(e) { /* silencieux (quota, navigation privée…) */ }
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(historyKey());
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!Array.isArray(saved) || !saved.length) return;
    renderLog = saved;
    saved.forEach(entry => {
      if (entry.type === 'user') {
        addBubble(entry.text, 'user');
        conversationHistory.push({ role: 'user', content: entry.text });
      } else if (entry.type === 'assistant') {
        addAssistantBubble(entry.text, entry.question, entry.suggestions || [], entry.pdf || null);
        conversationHistory.push({ role: 'assistant', content: entry.text });
      } else if (entry.type === 'alert') {
        addAlertBubble(entry.question);
        conversationHistory.push({ role: 'assistant', content: '[Information non disponible dans la base]' });
      }
    });
    goToChat();
  } catch(e) { /* silencieux */ }
}

async function loadWhoami() {
  try {
    const res = await fetch('/api/auth');
    const data = await res.json();
    if (!data.magasin) {
      window.location.href = '/login.html';
      return;
    }
    currentMagasin = data.magasin;
    if (data.nom) document.getElementById('headerSub').textContent = `${data.nom} (${data.magasin})`;
  } catch(e) {
    window.location.href = '/login.html';
    return;
  }
  loadHistory();
}
loadWhoami();

async function logout() {
  try { await fetch('/api/auth?action=logout', { method: 'POST' }); } catch(e) { /* silencieux */ }
  window.location.href = '/login.html';
}

// ── Logging Google Sheets ────────────────────────────────────
async function logQuestion(question, reponse, type, fiche) {
  try {
    await fetch('/api/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, reponse, type, fiche: fiche || '' })
    });
  } catch(e) { /* silencieux */ }
}

async function sendAlertEmail(question) {
  try {
    await fetch('/api/alert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, date: new Date().toLocaleString('fr-FR') })
    });
  } catch(e) { /* silencieux */ }
}

// ── Envoi du message ─────────────────────────────────────────
async function sendMessage() {
  const msg = inputEl.value.trim();
  if (!msg) return;

  goToChat();
  addBubble(msg, 'user');
  renderLog.push({ type: 'user', text: msg });
  saveHistory();

  // Ajouter à l'historique
  conversationHistory.push({ role: 'user', content: msg });

  inputEl.value = '';
  inputEl.disabled = true;
  sendBtnEl.disabled = true;
  typingEl.classList.add('active');
  scrollDown();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversationHistory.slice(-6) })
    });
    const data = await res.json();
    typingEl.classList.remove('active');

    if (data.hors_base === true) {
      addAlertBubble(msg);
      renderLog.push({ type: 'alert', question: msg });
      saveHistory();
      sendAlertEmail(msg);
      logQuestion(msg, '', 'hors_base');
      conversationHistory.push({ role: 'assistant', content: '[Information non disponible dans la base]' });
    } else if (data.text) {
      const txt = data.text.trim();
      addAssistantBubble(txt, msg, data.suggestions || [], data.pdf || null);
      renderLog.push({ type: 'assistant', text: txt, question: msg, suggestions: data.suggestions || [], pdf: data.pdf || null });
      saveHistory();
      logQuestion(msg, txt, 'reponse', data.pdf ? data.pdf.titre : '');
      conversationHistory.push({ role: 'assistant', content: txt });
    } else if (data.error) {
      throw new Error(data.error);
    } else {
      throw new Error('Réponse invalide');
    }
  } catch(err) {
    typingEl.classList.remove('active');
    showError('Erreur : ' + err.message);
  } finally {
    inputEl.disabled = false;
    sendBtnEl.disabled = false;
    inputEl.focus();
  }
}

// ── Bulle réponse assistant avec actions + suggestions ───────
function addAssistantBubble(text, question, suggestions, pdf) {
  const bubbleId = 'bubble-' + Date.now();

  // Message
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  const av = document.createElement('div');
  av.className = 'avatar';
  av.style.cssText = 'background:linear-gradient(135deg,#112033,#1e3a5f);color:#A87B27';
  av.textContent = '✦';
  const bub = document.createElement('div');
  bub.className = 'bubble md';
  bub.id = bubbleId;
  bub.innerHTML = typeof marked !== 'undefined' ? marked.parse(text) : text;
  wrap.appendChild(av);
  wrap.appendChild(bub);
  messagesEl.appendChild(wrap);

  // Carte PDF (si une procédure correspond)
  if (pdf && pdf.url) {
    const pdfWrap = document.createElement('div');
    pdfWrap.className = 'pdf-card-wrap';
    const dateLabel = pdf.dateMAJ ? `Mis à jour le ${formatDateFr(pdf.dateMAJ)}` : 'Procédure PDF';
    pdfWrap.innerHTML = `
      <a class="pdf-card" href="${pdf.url}" target="_blank" rel="noopener">
        <div class="pdf-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <div class="pdf-card-info">
          <div class="pdf-card-title">${pdf.titre}</div>
          <div class="pdf-card-meta">📄 ${dateLabel}</div>
        </div>
        <div class="pdf-card-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
        </div>
      </a>`;
    messagesEl.appendChild(pdfWrap);
  }

  // Boutons d'action
  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  actions.innerHTML = `
    <button class="msg-action-btn" onclick="copyResponse('${bubbleId}', this)">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copier
    </button>
    <button class="msg-action-btn" onclick="sendFeedback(this, '${encodeURIComponent(question)}', 'positif', '${encodeURIComponent(pdf && pdf.titre ? pdf.titre : '')}')" title="Réponse utile">
      👍 Utile
    </button>
    <button class="msg-action-btn" onclick="sendFeedback(this, '${encodeURIComponent(question)}', 'negatif', '${encodeURIComponent(pdf && pdf.titre ? pdf.titre : '')}')" title="Réponse incorrecte">
      👎 Incorrecte
    </button>`;
  messagesEl.appendChild(actions);

  // Suggestions "Voir aussi"
  const filtered = suggestions.filter(s => s && s.length > 0).slice(0, 3);
  if (filtered.length > 0) {
    const sugg = document.createElement('div');
    sugg.className = 'suggestions-wrap';
    sugg.innerHTML = `
      <div class="suggestions-label">Voir aussi</div>
      <div class="suggestions-chips">
        ${filtered.map(s => `<button class="sugg-chip" onclick="ask('${s.replace(/'/g, "\\'")}')">${s}</button>`).join('')}
      </div>`;
    messagesEl.appendChild(sugg);
  }

  scrollDown();
}

// ── Copier la réponse ────────────────────────────────────────
function copyResponse(bubbleId, btn) {
  const bub = document.getElementById(bubbleId);
  if (!bub) return;
  const text = bub.innerText || bub.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '✓ Copié';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copier`;
    }, 2000);
  });
}

// ── Feedback 👍/👎 ───────────────────────────────────────────
function sendFeedback(btn, questionEncoded, type, ficheEncoded) {
  const question = decodeURIComponent(questionEncoded);
  const fiche = ficheEncoded ? decodeURIComponent(ficheEncoded) : '';
  logQuestion(question, '', 'feedback_' + type, fiche);
  btn.classList.add(type === 'positif' ? 'liked' : 'disliked');
  btn.disabled = true;
  // Désactiver l'autre bouton feedback
  const sibling = btn.parentElement.querySelector(type === 'positif'
    ? '[onclick*="negatif"]' : '[onclick*="positif"]');
  if (sibling) sibling.disabled = true;
}

// ── Bulles standard ──────────────────────────────────────────
function addBubble(text, role) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? '👤' : '✦';
  const bub = document.createElement('div');
  if (role === 'assistant' && typeof marked !== 'undefined') {
    bub.className = 'bubble md';
    bub.innerHTML = marked.parse(text);
  } else {
    bub.className = 'bubble';
    bub.textContent = text;
  }
  wrap.appendChild(av);
  wrap.appendChild(bub);
  messagesEl.appendChild(wrap);
  scrollDown();
}

function addAlertBubble(question) {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  const av = document.createElement('div');
  av.className = 'avatar';
  av.style.cssText = 'background:linear-gradient(135deg,#112033,#1e3a5f);color:#A87B27';
  av.textContent = '✦';
  const bub = document.createElement('div');
  bub.className = 'bubble alert-bubble';
  bub.innerHTML = `<div class="alert-header"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Information non disponible</div>Cette information n'est pas présente dans ma base de données — merci de vous référer à l'équipe du bureau.`;
  wrap.appendChild(av);
  wrap.appendChild(bub);
  messagesEl.appendChild(wrap);
  scrollDown();
}

function showError(msg) {
  const div = document.createElement('div');
  div.className = 'error-msg';
  div.textContent = msg;
  messagesEl.appendChild(div);
  scrollDown();
  setTimeout(() => div.remove(), 6000);
}

function scrollDown() { chatEl.scrollTop = chatEl.scrollHeight; }

function formatDateFr(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch (e) { return iso; }
}

// ── ANNUAIRE ────────────────────────────────────────────────
let CONTACTS = [];
let activeFilter = 'Tous';

async function loadContacts() {
  try {
    const res = await fetch('/contacts.json');
    CONTACTS = await res.json();
    buildFilters();
    renderAnnuaire();
  } catch(e) {
    document.getElementById('annBody').innerHTML = '<div class="ann-empty">Impossible de charger l\'annuaire.</div>';
  }
}
loadContacts();

function buildFilters() {
  const services = ['Tous', ...new Set(CONTACTS.map(c => c.service))];
  const wrap = document.getElementById('annFilters');
  wrap.innerHTML = services.map(s =>
    `<button class="ann-filter ${s === activeFilter ? 'active' : ''}" onclick="setFilter('${s}')">${s}</button>`
  ).join('');
}

function setFilter(service) {
  activeFilter = service;
  buildFilters();
  renderAnnuaire();
}

function getInitials(nom) {
  return nom.split(' ').filter(w => w.length > 0).slice(0,2).map(w => w[0].toUpperCase()).join('');
}

function renderAnnuaire() {
  const q = (document.getElementById('annSearch')?.value || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let filtered = CONTACTS;
  if (activeFilter !== 'Tous') filtered = filtered.filter(c => c.service === activeFilter);
  if (q) filtered = filtered.filter(c =>
    (c.nom + ' ' + c.poste + ' ' + c.service + ' ' + (c.quiFaitQuoi||[]).join(' '))
      .toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q)
  );

  if (!filtered.length) {
    document.getElementById('annBody').innerHTML = '<div class="ann-empty">Aucun contact trouvé.</div>';
    return;
  }

  // Grouper par service
  const byService = {};
  filtered.forEach(c => {
    if (!byService[c.service]) byService[c.service] = [];
    byService[c.service].push(c);
  });

  let html = '';
  for (const [service, contacts] of Object.entries(byService)) {
    html += `<div class="ann-service-label">${service}</div>`;
    contacts.forEach((c, i) => {
      const id = `card-${service.replace(/\s/g,'-')}-${i}`;
      const hasActions = c.telephone || c.email;
      const qfqItems = (c.quiFaitQuoi || []).map(q => `<li>${q}</li>`).join('');
      html += `
        <div class="ann-card" id="${id}" onclick="toggleCard('${id}')">
          <div class="ann-card-top">
            <div class="ann-avatar">${c.photo ? `<img src="${c.photo}" alt="${c.nom}" />` : getInitials(c.nom)}</div>
            <div class="ann-info">
              <div class="ann-nom">${c.nom}</div>
              <div class="ann-poste">${c.poste}</div>
            </div>
            <div class="ann-chevron">▼</div>
          </div>
          ${hasActions ? `<div class="ann-card-actions">
            ${c.telephone ? `<a class="ann-action" href="tel:${c.telephone}">📞 ${c.telephone}</a>` : ''}
            ${c.email ? `<a class="ann-action" href="mailto:${c.email}">✉️ ${c.email}</a>` : ''}
          </div>` : ''}
          ${qfqItems ? `<div class="ann-qfq">
            <div class="ann-qfq-title">Qui fait quoi</div>
            <ul>${qfqItems}</ul>
          </div>` : ''}
        </div>`;
    });
  }
  document.getElementById('annBody').innerHTML = html;
}

function toggleCard(id) {
  document.getElementById(id)?.classList.toggle('expanded');
}

function toggleAnnuaire() {
  document.getElementById('annPanel').classList.toggle('open');
  document.getElementById('annOverlay').classList.toggle('open');
  if (document.getElementById('annPanel').classList.contains('open')) {
    setTimeout(() => document.getElementById('annSearch')?.focus(), 350);
  }
}
function closeAnnuaire() {
  document.getElementById('annPanel').classList.remove('open');
  document.getElementById('annOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeAnnuaire(); closeCategory(); closeBiblio(); } });
</script>
