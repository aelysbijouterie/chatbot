<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COUSSI IA — Aélys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    :root {
      --cream:       #F5F1EE;
      --sand:        #EFE8E0;
      --gold:        #A87B27;
      --gold-light:  #C9A04A;
      --navy:        #112033;
      --white:       #FFFFFF;
      --text:        #1C1C1C;
      --text-muted:  #7A7068;
      --alert:       #B94040;
      --glass-bg:    rgba(255,255,255,0.55);
      --glass-border:rgba(168,123,39,0.18);
      --shadow:      0 8px 40px rgba(17,32,51,0.10);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      position: relative; overflow: hidden;
    }
    body::before {
      content:'';
      position:fixed; inset:0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 10%, rgba(168,123,39,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 10% 90%, rgba(17,32,51,0.05) 0%, transparent 60%);
      pointer-events:none;
    }
    .orb { position:fixed; border-radius:50%; filter:blur(60px); pointer-events:none; animation:drift 18s ease-in-out infinite alternate; }
    .orb-1 { width:340px;height:340px;background:rgba(168,123,39,0.09);top:-80px;right:-80px;animation-delay:0s; }
    .orb-2 { width:280px;height:280px;background:rgba(17,32,51,0.06);bottom:-60px;left:-60px;animation-delay:-9s; }
    @keyframes drift { from{transform:translate(0,0) scale(1);}to{transform:translate(30px,20px) scale(1.08);} }

    .app {
      width:100%; max-width:820px;
      height:92vh; max-height:860px;
      display:flex; flex-direction:column;
      background:var(--glass-bg);
      backdrop-filter:blur(24px) saturate(1.4);
      -webkit-backdrop-filter:blur(24px) saturate(1.4);
      border:1px solid var(--glass-border);
      border-radius:28px;
      box-shadow:var(--shadow), 0 1px 0 rgba(255,255,255,0.8) inset;
      overflow:hidden; position:relative;
    }

    .header {
      padding:22px 28px 18px;
      background:rgba(255,255,255,0.7);
      border-bottom:1px solid rgba(168,123,39,0.12);
      display:flex; align-items:center; gap:14px; flex-shrink:0;
    }
    .logo-ring {
      width:44px;height:44px;border-radius:14px;
      background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 100%);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
      box-shadow:0 4px 14px rgba(17,32,51,0.22);
    }
    .logo-ring svg { width:22px;height:22px; }
    .header-text { flex:1; }
    .header-title { font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:600;color:var(--navy);letter-spacing:0.5px;line-height:1; }
    .header-sub { font-size:0.72rem;color:var(--text-muted);font-weight:400;margin-top:3px;letter-spacing:0.8px;text-transform:uppercase; }
    .status-pill { display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(168,123,39,0.08);border:1px solid rgba(168,123,39,0.2);border-radius:100px;font-size:0.72rem;color:var(--gold);font-weight:500;letter-spacing:0.3px; }
    .status-dot { width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.8);} }

    .chat { flex:1;overflow-y:auto;padding:24px 28px;scroll-behavior:smooth; }
    .chat::-webkit-scrollbar { width:5px; }
    .chat::-webkit-scrollbar-track { background:transparent; }
    .chat::-webkit-scrollbar-thumb { background:rgba(168,123,39,0.25);border-radius:10px; }

    .welcome { text-align:center;padding:20px 10px 10px; }
    .welcome-icon { font-size:2.2rem;margin-bottom:12px;display:block; }
    .welcome h2 { font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--navy);font-weight:600;margin-bottom:8px; }
    .welcome p { color:var(--text-muted);font-size:0.88rem;line-height:1.6;max-width:400px;margin:0 auto 28px; }
    .quick-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:680px;margin:0 auto; }
    .quick-btn {
      padding:14px 16px;
      background:rgba(255,255,255,0.8);
      border:1px solid rgba(168,123,39,0.2);
      border-radius:14px; cursor:pointer;
      font-family:'DM Sans',sans-serif;font-size:0.83rem;font-weight:500;color:var(--navy);
      text-align:left; transition:all 0.2s ease;
      display:flex; align-items:center; gap:10px;
      backdrop-filter:blur(8px);
    }
    .quick-btn:hover { background:rgba(255,255,255,0.95);border-color:var(--gold);box-shadow:0 4px 16px rgba(168,123,39,0.15);transform:translateY(-2px); }
    .btn-icon { width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 100%);display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0; }
    .btn-label { line-height:1.3; }
    .btn-label small { display:block;font-size:0.7rem;color:var(--text-muted);font-weight:400;margin-top:1px; }

    .msg { display:flex;gap:12px;margin-bottom:18px;animation:fadeUp 0.28s ease-out both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);} }
    .msg.user { flex-direction:row-reverse; }
    .avatar { width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;margin-top:2px; }
    .msg.user .avatar { background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 100%);box-shadow:0 3px 10px rgba(168,123,39,0.3); }
    .msg.assistant .avatar { background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 100%);box-shadow:0 3px 10px rgba(17,32,51,0.2); }
    .bubble { max-width:68%;padding:13px 17px;border-radius:16px;font-size:0.9rem;line-height:1.65; }
    .msg.user .bubble { background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 100%);color:var(--white);border-bottom-right-radius:4px;box-shadow:0 4px 16px rgba(17,32,51,0.18); }
    .msg.assistant .bubble { background:rgba(255,255,255,0.85);color:var(--text);border-bottom-left-radius:4px;box-shadow:0 2px 12px rgba(17,32,51,0.07);border:1px solid rgba(168,123,39,0.1); }
    .bubble.alert-bubble { background:rgba(185,64,64,0.07);border:1px solid rgba(185,64,64,0.25);color:var(--alert); }
    .alert-header { display:flex;align-items:center;gap:7px;font-weight:600;font-size:0.82rem;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px; }

    .typing { display:none;gap:12px;margin-bottom:18px; }
    .typing.active { display:flex; }
    .typing-dots { display:flex;gap:5px;align-items:center;padding:13px 17px;background:rgba(255,255,255,0.85);border-radius:16px;border-bottom-left-radius:4px;border:1px solid rgba(168,123,39,0.1); }
    .typing-dot { width:7px;height:7px;border-radius:50%;background:var(--gold);animation:bounce 1.3s ease-in-out infinite; }
    .typing-dot:nth-child(2){animation-delay:0.15s;}
    .typing-dot:nth-child(3){animation-delay:0.3s;}
    @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4;}30%{transform:translateY(-7px);opacity:1;} }

    .input-bar { padding:16px 20px;background:rgba(255,255,255,0.75);border-top:1px solid rgba(168,123,39,0.12);display:flex;gap:10px;align-items:center;flex-shrink:0; }
    #userInput { flex:1;padding:13px 18px;border:1.5px solid rgba(168,123,39,0.2);border-radius:14px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--text);background:rgba(255,255,255,0.9);outline:none;transition:border-color 0.2s,box-shadow 0.2s; }
    #userInput::placeholder { color:var(--text-muted); }
    #userInput:focus { border-color:var(--gold);box-shadow:0 0 0 3px rgba(168,123,39,0.1); }
    #sendBtn { width:46px;height:46px;border-radius:13px;border:none;background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 100%);color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s ease;box-shadow:0 4px 14px rgba(17,32,51,0.2); }
    #sendBtn:hover:not(:disabled) { transform:translateY(-2px);box-shadow:0 6px 20px rgba(17,32,51,0.3); }
    #sendBtn:disabled { opacity:0.45;cursor:not-allowed;transform:none; }
    #sendBtn svg { width:18px;height:18px; }

    .error-msg { background:rgba(185,64,64,0.08);border:1px solid rgba(185,64,64,0.2);color:var(--alert);padding:12px 16px;border-radius:12px;margin-bottom:14px;font-size:0.85rem;text-align:center;animation:fadeUp 0.25s ease; }

    .bubble.md p { margin-bottom: 8px; }
    .bubble.md p:last-child { margin-bottom: 0; }
    .bubble.md strong { font-weight: 600; color: var(--navy); }
    .bubble.md em { font-style: italic; color: var(--text-muted); }
    .bubble.md ul, .bubble.md ol { padding-left: 18px; margin: 6px 0; }
    .bubble.md li { margin-bottom: 4px; }
    .bubble.md h1,.bubble.md h2,.bubble.md h3 { font-family:"Playfair Display",serif; color:var(--navy); margin: 10px 0 4px; font-size:1rem; font-weight:600; }
    .bubble.md h3 { font-size:0.9rem; }
    .bubble.md blockquote { border-left:3px solid var(--gold); padding-left:10px; margin:6px 0; color:var(--text-muted); font-style:italic; }
    .bubble.md code { background:rgba(17,32,51,0.07); padding:1px 5px; border-radius:4px; font-size:0.82rem; }
    .bubble.md hr { border:none; border-top:1px solid rgba(168,123,39,0.2); margin:8px 0; }
    .source-tag { display:inline-block; margin-top:10px; padding:3px 10px; background:rgba(168,123,39,0.1); border:1px solid rgba(168,123,39,0.25); border-radius:100px; font-size:0.72rem; color:var(--gold); font-weight:500; }

    @media (max-width:600px) {
      .app { height:100dvh;max-height:100dvh;border-radius:0; }
      .bubble { max-width:82%; }
      .quick-grid { grid-template-columns:repeat(2,1fr); }
      .header { padding:16px 18px; }
      .chat { padding:16px; }
      .input-bar { padding:12px 14px; }
    }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="app">
  <div class="header">
    <div class="logo-ring">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#A87B27" stroke="#A87B27" stroke-width="0.5"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="header-title">COUSSI IA</div>
      <div class="header-sub">Assistant Aélys Nouvelle-Aquitaine</div>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      En ligne
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <span class="welcome-icon">✦</span>
      <h2>Bonjour !</h2>
      <p>Posez-moi vos questions sur les procédures internes. Je m'appuie uniquement sur la base documentaire Aélys.</p>
      <div class="quick-grid">
        <button class="quick-btn" onclick="ask('Procédure commandes or sans remise')">
          <div class="btn-icon">🛒</div>
          <div class="btn-label">Commandes<small>Or, argent, griffé, remisé…</small></div>
        </button>
        <button class="quick-btn" onclick="ask('Procédure défectueux — comment détecter fabrication ou utilisation')">
          <div class="btn-icon">🔍</div>
          <div class="btn-label">Défectueux<small>Procédures & détection</small></div>
        </button>
        <button class="quick-btn" onclick="ask('Procédure SAV créer une fiche, aide décisionnelle garantie')">
          <div class="btn-icon">🔧</div>
          <div class="btn-label">SAV & garanties<small>Réparations, litiges, décisions</small></div>
        </button>
        <button class="quick-btn" onclick="ask('Techniques de vente, objectifs PM PVM IV, SONCAS')">
          <div class="btn-icon">💬</div>
          <div class="btn-label">Techniques de vente<small>6 temps, SONCAS, objectifs</small></div>
        </button>
        <button class="quick-btn" onclick="ask('Références ODEIS, code famille, moyens de règlement')">
          <div class="btn-icon">💻</div>
          <div class="btn-label">ODEIS & références<small>Logiciel, codes, règlement</small></div>
        </button>
        <button class="quick-btn" onclick="ask('Programme formation nouvel entrant semaines')">
          <div class="btn-icon">📚</div>
          <div class="btn-label">Formation<small>Programme nouvel entrant</small></div>
        </button>
      </div>
    </div>
    <div class="typing" id="typing">
      <div class="avatar" style="background:linear-gradient(135deg,#112033,#1e3a5f);color:#A87B27">✦</div>
      <div class="typing-dots">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Posez votre question…" autocomplete="off" />
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
const chatEl    = document.getElementById('chat');
const inputEl   = document.getElementById('userInput');
const sendBtnEl = document.getElementById('sendBtn');
const typingEl  = document.getElementById('typing');

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendMessage(); });

function ask(q) { inputEl.value = q; sendMessage(); }

async function sendAlertEmail(question) {
  try {
    await fetch('/api/alert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question,
        date: new Date().toLocaleString('fr-FR')
      })
    });
  } catch(e) {
    console.warn('Erreur alerte email:', e);
  }
}

async function sendMessage() {
  const msg = inputEl.value.trim();
  if (!msg) return;

  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  addBubble(msg, 'user');
  inputEl.value = '';
  inputEl.disabled = true;
  sendBtnEl.disabled = true;
  typingEl.classList.add('active');
  scrollDown();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: msg }] })
    });
    const data = await res.json();
    typingEl.classList.remove('active');

    if (data.hors_base === true) {
      addAlertBubble();
      sendAlertEmail(msg);
    } else if (data.text) {
      addBubble(data.text.trim(), 'assistant');
    } else if (data.error) {
      throw new Error(data.error);
    } else {
      throw new Error('Réponse invalide');
    }
  } catch(err) {
    typingEl.classList.remove('active');
    showError('Erreur : ' + err.message);
  } finally {
    inputEl.disabled = false;
    sendBtnEl.disabled = false;
    inputEl.focus();
  }
}

function addBubble(text, role) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? '👤' : '✦';
  const bub = document.createElement('div');
  if (role === 'assistant' && typeof marked !== 'undefined') {
    bub.className = 'bubble md';
    bub.innerHTML = marked.parse(text);
  } else {
    bub.className = 'bubble';
    bub.textContent = text;
  }
  wrap.appendChild(av);
  wrap.appendChild(bub);
  chatEl.insertBefore(wrap, typingEl);
  scrollDown();
}

function addAlertBubble() {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  const av = document.createElement('div');
  av.className = 'avatar';
  av.style.cssText = 'background:linear-gradient(135deg,#112033,#1e3a5f);color:#A87B27';
  av.textContent = '✦';
  const bub = document.createElement('div');
  bub.className = 'bubble alert-bubble';
  bub.innerHTML = `<div class="alert-header"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Information non disponible</div>Cette information n'est pas présente dans ma base de données — merci de vous référer à l'équipe du bureau.`;
  wrap.appendChild(av);
  wrap.appendChild(bub);
  chatEl.insertBefore(wrap, typingEl);
  scrollDown();
}

function showError(msg) {
  const div = document.createElement('div');
  div.className = 'error-msg';
  div.textContent = msg;
  chatEl.insertBefore(div, typingEl);
  scrollDown();
  setTimeout(() => div.remove(), 6000);
}

function scrollDown() { chatEl.scrollTop = chatEl.scrollHeight; }
</script>
</body>
</html>
