<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outils Aélys</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream:      #F5F1EE;
    --sand:       #EFE8E0;
    --gold:       #A87B27;
    --gold-light: #C9A04A;
    --navy:       #112033;
    --white:      #FFFFFF;
    --text:       #26313F;
    --text-muted: #7A7068;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
  }
  header {
    background: var(--navy);
    padding: 28px 24px 24px;
    text-align: center;
  }
  header .wordmark {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 1.6rem;
    color: var(--gold-light);
    letter-spacing: 1px;
  }
  header p {
    margin: 6px 0 0;
    color: rgba(245,241,238,0.75);
    font-size: 0.85rem;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
  }
  .tool-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 160px;
    height: 160px;
    background: var(--white);
    border: 1px solid var(--sand);
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    padding: 16px;
    text-align: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    box-shadow: 0 1px 2px rgba(17,32,51,0.04);
  }
  .tool-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(17,32,51,0.12);
    border-color: var(--gold-light);
  }
  .tool-card .icon { font-size: 2.1rem; line-height: 1; }
  .tool-card .name {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 1rem;
    color: var(--navy);
  }
  .tool-card .desc {
    font-size: 0.74rem;
    color: var(--text-muted);
    line-height: 1.3;
  }
  .empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
    max-width: 420px;
    margin: 0 auto;
  }
  footer {
    text-align: center;
    padding: 20px;
    font-size: 0.72rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">AÉLYS</div>
  <p>Outils internes — un seul lien à retenir</p>
</header>

<main>
  <div id="grid" class="grid"></div>
  <p id="emptyMsg" class="empty" style="display:none;">
    Aucun outil pour l’instant. Ajoutez-en un dans la liste TOOLS en haut du fichier hub.html.
  </p>
</main>

<footer>Aélys Bijouterie — Nouvelle-Aquitaine</footer>

<script>
  // ─────────────────────────────────────────────────────────────────
  // Pour ajouter un nouvel outil : dupliquez une ligne ci-dessous et
  // changez juste name / desc / icon / url. Rien d'autre à toucher.
  // "icon" peut être n'importe quel emoji (📚 📦 🧾 📅 ...).
  // ─────────────────────────────────────────────────────────────────
  const TOOLS = [
    {
      name: "Aurel'IA",
      desc: "Bibliothèque de procédures & assistant magasin",
      icon: "📚",
      url: "https://chatbot-aelys-relays.vercel.app/"
    },
    // {
    //   name: "Nom de l'outil",
    //   desc: "Description courte",
    //   icon: "🔧",
    //   url: "https://mon-outil.vercel.app/"
    // },
  ];

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const grid = document.getElementById('grid');
  if (TOOLS.length === 0) {
    document.getElementById('emptyMsg').style.display = 'block';
  } else {
    grid.innerHTML = TOOLS.map(t => `
      <a class="tool-card" href="${escapeHtml(t.url)}">
        <div class="icon">${escapeHtml(t.icon || '🔗')}</div>
        <div class="name">${escapeHtml(t.name)}</div>
        <div class="desc">${escapeHtml(t.desc || '')}</div>
      </a>
    `).join('');
  }
</script>

</body>
</html>
