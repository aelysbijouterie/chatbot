[build]
  command = "node build.js"
  functions = "netlify/functions"
  publish = "."

[functions]
  included_files = ["netlify/functions/kb.json"]

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/alert"
  to = "/.netlify/functions/alert"
  status = 200
